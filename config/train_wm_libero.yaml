defaults:
  - setup
  - logger: wandb
  - ../lumos/config/tensor_cores@_global_
  - ../lumos/config/callbacks@callbacks: wm_default
  - ../lumos/config/datamodule@datamodule: static_gripper_cam
  - ../lumos/config/world_model@world_model: dreamer_v2
  - ../lumos/config/trainer@trainer: wm_default
  - _self_

  - override ../lumos/config/datamodule/proprioception_dims@datamodule.proprioception_dims: robot_full
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

script: state_wm
datamodule:
  root_data_dir: ${root}/dataset/libero/libero_90_calvin_fmt_64
  
hydra:
  run:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - log_dir
          - datamodule.root_data_dir 