defaults:
  - train_wm
  - override ../lumos/config/datamodule/batch_sampler@datamodule.batch_sampler: batch_equidistant
  - override logger: none
  - override hydra/job_logging: colorlog
  - override hydra/hydra_logging: colorlog

datamodule:
  root_data_dir: ${root}/dataset/task_D_D_64
  action_chunk_data_dir: ${root}/dataset/task_D_D_ac5
  action_chunk_size: 5
  train_batch_size: 25
  val_batch_size: 25
  use_cached_data: false

trainer:
  devices: 2
  strategy: ddp
  use_distributed_sampler: false


log_dir: ${oc.env:DIWA_LOG_DIR}/wm/
script: wm
  
hydra:
  run:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.override_dirname}
  job:
    config:
      override_dirname:
        exclude_keys:
          - log_dir
          - datamodule.root_data_dir 